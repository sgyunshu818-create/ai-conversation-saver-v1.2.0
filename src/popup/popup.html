<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Conversation Saver</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div>
          <h1>AI Saver</h1>
          <p>Auto-save locally, export when needed</p>
        </div>
      </header>

      <p id="status" class="status" role="status"></p>

      <section class="current">
        <div class="section-title">
          <h2>Current conversation</h2>
          <span id="live-state">Checking</span>
        </div>
        <article id="current-card" class="conversation live-card">
          <div class="conversation-title">Open ChatGPT or Gemini</div>
          <div class="conversation-meta">Waiting for a supported conversation page.</div>
          <div class="preview">The popup will show live message information here.</div>
        </article>
      </section>

      <section class="saved">
        <div class="section-title">
          <h2>Saved</h2>
          <span id="count">0</span>
        </div>
        <div id="conversation-list" class="conversation-list"></div>
      </section>
    </main>

    <script src="../shared/conversation-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
