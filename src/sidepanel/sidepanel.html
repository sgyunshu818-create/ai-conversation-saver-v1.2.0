<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatAi Memo</title>
    <link rel="stylesheet" href="../popup/popup.css">
  </head>
  <body data-view="sidepanel">
    <main class="app-shell">
      <section class="content">
        <p id="status" class="status" role="status"></p>

        <section id="memory-view" class="view active" aria-label="记忆界面">
          <div id="memory-list-screen" class="memory-screen active">
            <div class="memory-home-top">
              <div class="memory-stats" aria-label="记忆统计">
                <section class="stat-card" aria-label="总对话数">
                  <span class="stat-label">总对话数</span>
                  <strong id="total-conversations" class="stat-number total">0</strong>
                </section>
                <section class="stat-card" aria-label="今日新增">
                  <span class="stat-label">今日新增</span>
                  <strong id="today-conversations" class="stat-number today">0</strong>
                </section>
              </div>
              <div class="memory-divider"></div>
              <div class="memory-toolbar">
                <label class="search-shell" aria-label="搜索对话">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.5-3.5"></path>
                  </svg>
                  <input id="memory-search" type="search" placeholder="搜索标题或内容">
                  <button id="filter-toggle" class="filter-toggle" type="button" aria-label="筛选">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="M3 5h18"></path>
                      <path d="M6 12h12"></path>
                      <path d="M10 19h4"></path>
                    </svg>
                  </button>
                </label>
                <div id="filter-panel" class="filter-panel" hidden>
                  <label>
                    <span>日期范围</span>
                    <select id="date-range-filter">
                      <option value="all">全部时间</option>
                      <option value="week">最近一周</option>
                      <option value="half-month">最近半个月</option>
                      <option value="month">最近一月</option>
                      <option value="custom">自定义</option>
                    </select>
                  </label>
                  <div class="date-filter-row">
                    <label>
                      <span>开始</span>
                      <input id="filter-start-date" type="date">
                    </label>
                    <label>
                      <span>结束</span>
                      <input id="filter-end-date" type="date">
                    </label>
                  </div>
                  <label>
                    <span>平台来源</span>
                    <select id="source-filter">
                      <option value="all">全部平台</option>
                    </select>
                  </label>
                </div>
              </div>
            </div>
            <div id="memory-list" class="memory-list"></div>
          </div>

          <div id="memory-detail-screen" class="memory-screen">
            <article id="conversation-detail" class="detail-card empty-detail">
              <div class="empty">选择一个对话查看详情。</div>
            </article>
          </div>
        </section>

        <section id="settings-view" class="view" aria-label="设置界面">
          <section class="settings-card basic-settings" aria-label="基础设置">
            <div class="settings-card-title">
              <span class="settings-card-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5z"></path>
                  <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.04.04a2 2 0 0 1-2.82 2.82l-.04-.04A1.8 1.8 0 0 0 15 19.4a1.8 1.8 0 0 0-1 .6l-.02.02a2 2 0 0 1-3.96 0L10 20a1.8 1.8 0 0 0-1-.6 1.8 1.8 0 0 0-1.98.36l-.04.04a2 2 0 1 1-2.82-2.82l.04-.04A1.8 1.8 0 0 0 4.6 15a1.8 1.8 0 0 0-.6-1l-.02-.02a2 2 0 0 1 0-3.96L4 10a1.8 1.8 0 0 0 .6-1 1.8 1.8 0 0 0-.36-1.98l-.04-.04a2 2 0 0 1 2.82-2.82l.04.04A1.8 1.8 0 0 0 9 4.6a1.8 1.8 0 0 0 1-.6l.02-.02a2 2 0 0 1 3.96 0L14 4a1.8 1.8 0 0 0 1 .6 1.8 1.8 0 0 0 1.98-.36l.04-.04a2 2 0 1 1 2.82 2.82l-.04.04A1.8 1.8 0 0 0 19.4 9c.1.35.3.7.6 1l.02.02a2 2 0 0 1 0 3.96L20 14a1.8 1.8 0 0 0-.6 1z"></path>
                </svg>
              </span>
              <span>基础设置</span>
            </div>
            <label class="setting-row" for="auto-save-toggle">
              <span>
                <strong>自动保存对话</strong>
                <small>在支持的ai对话页面自动保存对话记录</small>
              </span>
              <input id="auto-save-toggle" class="settings-switch" type="checkbox" role="switch" checked>
            </label>
          </section>

          <section class="settings-card storage-management" aria-label="存储管理">
            <div class="settings-card-title">
              <span class="settings-card-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M21 8c0 2.2-4 4-9 4S3 10.2 3 8s4-4 9-4 9 1.8 9 4z"></path>
                  <path d="M3 8v8c0 2.2 4 4 9 4s9-1.8 9-4V8"></path>
                  <path d="M3 12c0 2.2 4 4 9 4s9-1.8 9-4"></path>
                </svg>
              </span>
              <span>存储管理</span>
            </div>
            <div class="storage-meter">
              <div class="storage-header">
                <span>已使用存储</span>
                <span id="storage-label">0 KB / 500 MB</span>
              </div>
              <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="storage-progress" class="progress-fill"></div>
              </div>
              <p id="storage-warning" class="storage-warning"></p>
            </div>
            <div class="settings-actions">
              <div class="export-control">
                <button id="export-menu-toggle" class="export-button" type="button" aria-expanded="false" aria-controls="export-menu">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M12 3v12"></path>
                    <path d="m7 10 5 5 5-5"></path>
                    <path d="M5 21h14"></path>
                  </svg>
                  <span>导出数据</span>
                  <svg class="export-chevron" aria-hidden="true" viewBox="0 0 24 24">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </button>
                <div id="export-menu" class="export-menu" hidden>
                  <button id="export-multiple-files" type="button">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                      <path d="M14 2v6h6"></path>
                    </svg>
                    <span>导出多个文件</span>
                  </button>
                  <button id="export-combined-document" type="button">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <span>合并为一个文档</span>
                  </button>
                </div>
              </div>
              <button id="delete-selected" class="delete-icon-button" type="button" aria-label="删除所选对话" title="删除所选对话">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M3 6h18"></path>
                  <path d="M8 6V4h8v2"></path>
                  <path d="M19 6l-1 14H6L5 6"></path>
                  <path d="M10 11v5"></path>
                  <path d="M14 11v5"></path>
                </svg>
              </button>
            </div>
            <span id="backup-status" hidden>未选择</span>
          </section>

          <section class="settings-card about-card" aria-label="关于">
            <div class="settings-card-title">
              <span class="settings-card-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M12 16v-4"></path>
                  <path d="M12 8h.01"></path>
                </svg>
              </span>
              <span>关于</span>
            </div>
            <div class="about-meta">
              <div><span>版本</span><strong>v1.2.0</strong></div>
              <div><span>作者</span><strong>无意见云舒</strong></div>
            </div>
            <button class="product-site-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M2 12h20"></path>
                <path d="M12 2a15.3 15.3 0 0 1 0 20"></path>
                <path d="M12 2a15.3 15.3 0 0 0 0 20"></path>
              </svg>
              <span>产品官网</span>
            </button>
          </section>

          <section class="settings-card supported-ai-card" aria-label="支持的AI">
            <div class="settings-card-title">
              <span class="settings-card-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 3 4 7v6c0 5 3.4 7.7 8 9 4.6-1.3 8-4 8-9V7z"></path>
                  <path d="m9 12 2 2 4-5"></path>
                </svg>
              </span>
              <span>支持的AI</span>
            </div>
            <div class="supported-ai-list">
              <div class="supported-ai-row"><img src="https://cdn.oaistatic.com/assets/favicon-eex17e9e.ico" alt="ChatGPT logo"><span class="supported-ai-name">ChatGPT</span><span class="supported-ai-check" aria-label="已支持">✓</span></div>
              <div class="supported-ai-row"><img src="https://www.gstatic.com/lamda/images/gemini_sparkle_aurora_33f86dc0c0257da337c63.svg" alt="Gemini logo"><span class="supported-ai-name">Gemini</span><span class="supported-ai-check" aria-label="已支持">✓</span></div>
              <div class="supported-ai-row"><img src="https://fe-static.deepseek.com/chat/favicon.svg" alt="DeepSeek logo"><span class="supported-ai-name">DeepSeek</span><span class="supported-ai-check" aria-label="已支持">✓</span></div>
              <div class="supported-ai-row"><img src="https://www.kimi.com/favicon.ico" alt="Kimi logo"><span class="supported-ai-name">Kimi</span><span class="supported-ai-check" aria-label="已支持">✓</span></div>
              <div class="supported-ai-row"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b0/Claude_AI_symbol.svg" alt="Claude logo"><span class="supported-ai-name">Claude</span><span class="supported-ai-check" aria-label="已支持">✓</span></div>
              <div class="supported-ai-row"><img src="https://lf-flow-web-cdn.doubao.com/obj/flow-doubao/doubao/chat/favicon.png" alt="Doubao logo"><span class="supported-ai-name">Doubao</span><span class="supported-ai-check" aria-label="已支持">✓</span></div>
              <div class="supported-ai-row"><img src="https://g.alicdn.com/qwenweb/qwen-ai-fe/0.0.4/favicon.ico" alt="Qwen logo"><span class="supported-ai-name">Qwen</span><span class="supported-ai-check" aria-label="已支持">✓</span></div>
              <div class="supported-ai-row"><img src="https://eb-static.cdn.bcebos.com/logo/favicon.ico" alt="Wenxin Yiyan logo"><span class="supported-ai-name">Wenxin Yiyan</span><span class="supported-ai-check" aria-label="已支持">✓</span></div>
              <div class="supported-ai-row"><img src="https://chatglm.cn/favicon.ico" alt="ChatGLM logo"><span class="supported-ai-name">ChatGLM</span><span class="supported-ai-check" aria-label="已支持">✓</span></div>
              <div class="supported-ai-row"><img src="https://chat.minimax.io/favicon.ico" alt="MiniMax logo"><span class="supported-ai-name">MiniMax</span><span class="supported-ai-check" aria-label="已支持">✓</span></div>
            </div>
          </section>
        </section>
      </section>

      <aside class="rail rail-right" aria-label="界面切换">
        <button class="rail-button active" type="button" data-target-view="memory" aria-label="记忆界面" title="记忆">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v16H7.5A2.5 2.5 0 0 0 5 21.5z"></path>
            <path d="M5 5.5v16"></path>
            <path d="M9 7h6"></path>
          </svg>
        </button>
        <button class="rail-button" type="button" data-target-view="settings" aria-label="设置界面" title="设置">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5z"></path>
            <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.04.04a2 2 0 0 1-2.82 2.82l-.04-.04A1.8 1.8 0 0 0 15 19.4a1.8 1.8 0 0 0-1 .6l-.02.02a2 2 0 0 1-3.96 0L10 20a1.8 1.8 0 0 0-1-.6 1.8 1.8 0 0 0-1.98.36l-.04.04a2 2 0 1 1-2.82-2.82l.04-.04A1.8 1.8 0 0 0 4.6 15a1.8 1.8 0 0 0-.6-1l-.02-.02a2 2 0 0 1 0-3.96L4 10a1.8 1.8 0 0 0 .6-1 1.8 1.8 0 0 0-.36-1.98l-.04-.04a2 2 0 0 1 2.82-2.82l.04.04A1.8 1.8 0 0 0 9 4.6a1.8 1.8 0 0 0 1-.6l.02-.02a2 2 0 0 1 3.96 0L14 4a1.8 1.8 0 0 0 1 .6 1.8 1.8 0 0 0 1.98-.36l.04-.04a2 2 0 1 1 2.82 2.82l-.04.04A1.8 1.8 0 0 0 19.4 9c.1.35.3.7.6 1l.02.02a2 2 0 0 1 0 3.96L20 14a1.8 1.8 0 0 0-.6 1z"></path>
          </svg>
        </button>
      </aside>
    </main>

    <dialog id="selection-dialog" class="selection-dialog">
      <form method="dialog">
        <div class="dialog-header">
          <h2 id="selection-title">选择对话</h2>
          <button id="selection-close" type="submit">关闭</button>
        </div>
        <label class="select-all-row">
          <input id="select-all" type="checkbox">
          <span>全选</span>
        </label>
        <div id="selection-site-filter" class="site-filter selection-filter" role="tablist" aria-label="选择列表 AI 服务筛选"></div>
        <div id="selection-list" class="selection-list"></div>
        <div class="dialog-actions">
          <span id="selection-count">已选择 0 个</span>
          <button id="selection-confirm" type="button">确认</button>
        </div>
      </form>
    </dialog>

    <script src="../shared/conversation-utils.js"></script>
    <script src="../popup/popup.js"></script>
  </body>
</html>
